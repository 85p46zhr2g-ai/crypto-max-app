<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAM MAX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; padding: 20px; padding-bottom: 80px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #f0b90b; font-size: 24px; }
        .card { background: #16213e; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card h3 { color: #f0b90b; margin-bottom: 10px; font-size: 18px; }
        .card p { font-size: 14px; color: #ccc; margin-bottom: 5px; }
        .btn { background: #f0b90b; color: #1a1a2e; border: none; padding: 15px; font-size: 16px; border-radius: 10px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .btn-success { background: #00ff88; color: #1a1a2e; }
        .hidden { display: none; }
        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #16213e; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #0f3460; }
        .nav-item { text-align: center; color: #888; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: #f0b90b; }
        .nav-item span { font-size: 20px; display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 GRAM MAX</h1>
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="page-home">
        <div class="card">
            <p>💰 الرصيد الحالي</p>
            <div style="font-size: 28px; color: #00ff88; font-weight: bold; text-align: center;" id="balance">0.00 GRAM</div>
        </div>
        <div class="card">
            <h3>💰 الاستثمار</h3>
            <p>1️⃣ 1 GRAM ➜ 1.15 GRAM (12 ساعة)</p>
            <p>2️⃣ 2 GRAM ➜ 2.20 GRAM (24 ساعة)</p>
            <p>3️⃣ 5 GRAM ➜ 5.70 GRAM (48 ساعة)</p>
            <p>4️⃣ 7 GRAM ➜ 8.30 GRAM (3 أيام)</p>
            <p>5️⃣ 10 GRAM ➜ 13 GRAM (5 أيام)</p>
            <button class="btn btn-success" onclick="sendDeposit()">✅ تم الإيداع</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bottom">
        <div class="nav-item active" onclick="showPage('home')"><span>🏠</span>الرئيسية</div>
        <div class="nav-item" onclick="showPage('invest')"><span>💰</span>استثمار</div>
        <div class="nav-item" onclick="showPage('stats')"><span>📈</span>إحصائيات</div>
        <div class="nav-item" onclick="showPage('settings')"><span>⚙️</span>إعدادات</div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function showPage(pageId) {
            document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + pageId).classList.remove('hidden');
        }

        function sendDeposit() {
            // إرسال إشارة إلى البوت بأن المستخدم ضغط على زر "تم الإيداع"
            window.Telegram.WebApp.sendData(JSON.stringify({ action: "deposit_confirmed" }));
            window.Telegram.WebApp.close();
        }
    </script>
</body>
</html>
